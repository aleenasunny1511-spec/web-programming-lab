<html>
<head><title>Registration Form</title></head>
<body>
<form>
<h1> <center>REGISTRATION FORM</center> </h1>


<fieldset><legend>User Information</legend>
<label for="name">Name<br></label>
<select name="title">
<option>Miss</option>
<option>Mr</option>
<option>Mrs</option></select>

<input type="text" id="name" required></input><br><br>
<label for="phone" class="c3">Phone No<br></label>
<input type="tel" maxlength="10" required></input>
<label for="email">Email Id</label>
<input type="email" required></input>
</fieldset>
<br><br>

<label>Address  <textarea type="text" rows="4"></textarea></label><br><br>
<label>Gender</label>
<input type="radio" name="gender"><label>Male </label>
<input type="radio" name="gender"><label>Female </label>
<input type="radio" name="gender"><label>Other </label>
</label><br><br>

<label>Languages Known
<input type="checkbox">Malayalam</input>
<input type="checkbox">English</input>
<input type="checkbox">Hindi</input>
<input type="checkbox">Kannada</input>
</label><br><br>
<label for="course">Course</label>
<select id="course">
<option>MCA</option>
<option>BTech in AI/ML</option>
<option>BTech in CS</option>
<option>BTech in EEE</option>
<option>BTech in CE</option>
<option>BTech in Architecture</option>
<option>BTech in IT</option>
<option>MBA</option>
</select>
<br><br>
<button>Submit</button>
<button>Reset</button>
</form>
<link rel="stylesheet" table="text/css" href="program5.css">
</body>
</html>
